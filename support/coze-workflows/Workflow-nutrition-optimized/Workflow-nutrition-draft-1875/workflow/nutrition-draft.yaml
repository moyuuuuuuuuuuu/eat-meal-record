                    6. units 至少返回1个稳定常用单位，weight 表示1单位的典型可食部克重。恰好1项 is_default=1。若无法确定稳定的份量单位，只返回 {"name":"克","weight":1,"is_default":1,"type":"weight"}，不要根据照片估算“1份”的重量。
                    7. unit.type 只能是 weight、count、volume、package、service、length。
                    8. tags 必须是“标签类型 => 标签数组”的对象，至少包含一个有效标签。类型只能是：餐次、口味、营养、烹饪方式、适用人群、食材状态、过敏原、品牌产地、时令季节、特殊场景、存储方式。
                    9. is_common：大众常见食物为1，生僻或特定品牌食物为2。is_ingredient：基础食材为1，菜肴、饮品及加工食品为2。

