    - id: "165951"
      type: llm
      title: 文字
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-LLM-v2.jpg
      description: "调用大语言模型,使用变量和提示词生成回复"
      version: "3"
      position:
        x: 1560
        y: 0
      parameters:
        fcParamVar:
            knowledgeFCParam: {}
        llmParam:
            - name: apiMode
              input:
                type: integer
                value: "0"
            - name: temperature
              input:
                type: float
                value: "0.2"
            - name: topP
              input:
                type: float
                value: "1"
            - name: frequencyPenalty
              input:
                type: float
                value: "0"
            - name: maxTokens
              input:
                type: integer
                value: "4096"
            - name: spCurrentTime
              input:
                type: boolean
                value: false
            - name: spAntiLeak
              input:
                type: boolean
                value: false
            - name: thinkingType
              input:
                type: string
                value: enabled
            - name: responseFormat
              input:
                type: integer
                value: "2"
            - name: modelName
              input:
                type: string
                value: 豆包·1.8·深度思考
            - name: modelType
              input:
                type: integer
                value: "1768187121"
            - name: generationDiversity
              input:
                type: string
                value: balance
            - name: parameters
              input:
                type: object
                properties:
                    max_completion_tokens:
                        type: integer
                        value: "0"
                    reasoning_effort:
                        type: string
                        value: medium
                value: null
            - name: prompt
              input:
                type: string
                value: '{{input}}'
            - name: enableChatHistory
              input:
                type: boolean
                value: false
            - name: chatHistoryRound
              input:
                type: integer
                value: "3"
            - name: systemPrompt
              input:
                type: string
                value: |-
                    你是食物标准化与营养数据专家。根据用户文字，识别其明确提到已经食用的食物，并输出可直接写入 eat-meal-record 食品库的数据。

                    数据口径：
                    1. 顶层必须是 JSON 数组，每个元素是一种食物；禁止 Markdown、说明文字和额外包装字段。
                    2. name 使用简短、通用、可复用的中文标准食物名。不要包含“约、一些、半碗、早餐”等数量或场景词；只有用户明确说出品牌时才保留品牌。
                    3. nutrition 的 value 一律表示每100g可食部营养值，不是用户本次食用份量的总营养。数值必须是非负 JSON 数字，不带单位。
                    4. nutrition 必须且只能包含：kcal、pro、fat、carb、fiber、vit_c、mag、folic、cal、iron、vit_e。单位分别遵循项目 food_nutrients 表：kcal 为 kcal/100g，pro/fat/carb/fiber 为 g/100g，其余为 mg/100g。
                    5. units 是该标准食物长期稳定的常用换算单位，不表达用户本次吃了多少。weight 表示1个该单位对应的可食部克重，必须为大于0的数字。至少返回1项，且恰好1项 is_default=1。
                    6. unit.type 只能是 weight、count、volume、package、service、length。克/千克用 weight，毫升/升用 volume，个/枚/根用 count，袋/盒/罐用 package，碗/盘/份用 service。
                    7. tags 必须是“标签类型 => 标签数组”的对象，至少包含一个有效标签。类型只能是：餐次、口味、营养、烹饪方式、适用人群、食材状态、过敏原、品牌产地、时令季节、特殊场景、存储方式。不要使用“推荐餐次”“特性”等别名，不要用斜杠拼接标签。
                    8. is_common：大众常见食物为1，生僻或特定品牌食物为2。is_ingredient：基础食材为1，菜肴、饮品及加工食品为2。
                    9. cat 使用稳定、简短的食品分类名称。信息不足时采用最合理的常见值，不虚构具体品牌、配方或食材。

                    仅返回如下结构的合法 JSON：
                    [{"name":"熟白米饭","cat":"五谷","is_common":1,"is_ingredient":2,"tags":{"餐次":["午餐","晚餐"],"口味":["清淡"],"食材状态":["熟食"]},"units":[{"name":"碗","weight":200,"is_default":1,"type":"service"},{"name":"克","weight":1,"is_default":0,"type":"weight"}],"nutrition":[{"name":"kcal","value":116},{"name":"pro","value":2.6},{"name":"fat","value":0.3},{"name":"carb","value":25.9},{"name":"fiber","value":0.3},{"name":"vit_c","value":0},{"name":"mag","value":15},{"name":"folic","value":3},{"name":"cal","value":7},{"name":"iron","value":1.3},{"name":"vit_e","value":0}]}]
            - name: stableSystemPrompt
              input:
                type: string
                value: ""
            - name: canContinue
              input:
                type: boolean
                value: false
            - name: loopPromptVersion
              input:
                type: string
                value: ""
            - name: loopPromptName
              input:
                type: string
                value: ""
            - name: loopPromptId
              input:
                type: string
                value: ""
        node_inputs:
            - name: input
              input:
                value:
                    path: text
                    ref_node: "100001"
        node_outputs:
            output:
                type: string
                value: null
            reasoning_content:
                type: string
                value: null
        settingOnError:
            processType: 1
            retryTimes: 0
            switch: false
            timeoutMs: 180000
