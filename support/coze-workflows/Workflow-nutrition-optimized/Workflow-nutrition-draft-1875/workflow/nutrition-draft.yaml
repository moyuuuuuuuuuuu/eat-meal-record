    - id: "146879"
      type: code
      title: 代码
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 2380
        y: 158
      parameters:
        code: |-
            import json
            import re

            async def main(args: Args) -> Output:
                params = args.params
                raw = next((params.get(key) for key in ('text', 'image', 'audio') if params.get(key)), '')
                if not raw:
                    return {"result": ""}

                text = str(raw).strip()
                text = re.sub(r'^```(?:json)?\s*|\s*```$', '', text, flags=re.I | re.S).strip()
                try:
                    data = json.loads(text)
                except Exception:
                    return {"result": ""}

                # 兼容模型偶发返回 {"foods": [...]}，对外仍保持项目需要的 JSON 数组。
                if isinstance(data, dict):
                    data = data.get('foods', [])
                if not isinstance(data, list):
                    return {"result": ""}

                nutrient_keys = ('kcal', 'pro', 'fat', 'carb', 'fiber', 'vit_c', 'mag', 'folic', 'cal', 'iron', 'vit_e')
                unit_types = {'weight', 'count', 'volume', 'package', 'service', 'length'}
                tag_types = {'餐次', '口味', '营养', '烹饪方式', '适用人群', '食材状态', '过敏原', '品牌产地', '时令季节', '特殊场景', '存储方式'}
                normalized = []

                for item in data:
                    if not isinstance(item, dict):
                        continue
                    name = str(item.get('name', '')).strip()
                    if not name:
                        continue

                    nutrient_map = {}
                    for nutrient in item.get('nutrition', []):
                        if not isinstance(nutrient, dict) or nutrient.get('name') not in nutrient_keys:
                            continue
                        try:
                            value = float(nutrient.get('value', 0))
                        except Exception:
                            continue
                        if value >= 0:
                            nutrient_map[nutrient['name']] = round(value, 2)
                    if any(key not in nutrient_map for key in nutrient_keys):
                        continue

                    units = []
                    for unit in item.get('units', []):
                        if not isinstance(unit, dict):
                            continue
                        unit_name = str(unit.get('name', '')).strip()
                        unit_type = unit.get('type')
                        try:
                            weight = float(unit.get('weight', 0))
                        except Exception:
                            continue
                        if unit_name and unit_type in unit_types and weight > 0:
                            units.append({
                                'name': unit_name,
                                'weight': round(weight, 2),
                                'is_default': 1 if unit.get('is_default') in (1, True, '1') else 0,
                                'type': unit_type,
                            })
                    if not units:
                        continue
                    default_index = next((index for index, unit in enumerate(units) if unit['is_default'] == 1), 0)
                    for index, unit in enumerate(units):
                        unit['is_default'] = 1 if index == default_index else 0

                    tags = {}
                    raw_tags = item.get('tags', {})
                    if isinstance(raw_tags, dict):
                        for tag_type, values in raw_tags.items():
                            if tag_type not in tag_types:
                                continue
                            if not isinstance(values, list):
                                values = re.split(r'[、,，/|]+', str(values))
                            values = list(dict.fromkeys(str(value).strip() for value in values if str(value).strip()))
                            if values:
                                tags[tag_type] = values
                    if not tags:
                        continue

                    normalized.append({
                        'name': name[:255],
                        'cat': str(item.get('cat') or '其他').strip()[:255],
                        'is_common': 1 if item.get('is_common') in (1, True, '1') else 2,
                        'is_ingredient': 1 if item.get('is_ingredient') in (1, True, '1') else 2,
                        'tags': tags,
                        'units': units,
                        'nutrition': [{'name': key, 'value': nutrient_map[key]} for key in nutrient_keys],
                    })

                return {"result": json.dumps(normalized, ensure_ascii=False, separators=(',', ':'))}
