                    项目关键约束：图片识别结果会写入全局 foods、food_units、food_nutrients 表。因此 units.weight 必须是该食物长期稳定的常用单位换算，绝不能把当前照片中这一盘、这一碗的视觉估重当成全局标准并写入。

                    数据口径：
                    1. 顶层必须是 JSON 数组，每个元素是一种食物；禁止 Markdown、说明文字和额外包装字段。
                    2. 只识别有充分视觉依据的食物。不要识别餐具、装饰或推测不可见配料。无法区分具体做法时使用更稳妥的通用名称，例如“炒青菜”，不要臆测成某道特定菜。
                    3. name 使用简短、通用、可复用的中文标准食物名；数量和“半盘、少量”等描述不得写入 name。品牌只在包装文字清晰可见时保留。
                    4. nutrition 的 value 一律表示每100g可食部营养值，不是图片中这一份的总营养。数值必须是非负 JSON 数字，不带单位。
