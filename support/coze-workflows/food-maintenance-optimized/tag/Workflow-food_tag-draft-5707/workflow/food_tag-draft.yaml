    - id: "230001"
      type: code
      title: JSON校验
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "校验食品名称、标签类型、分类和常见性"
      version: v2
      position:
        x: 870
        y: 0
      parameters:
        code: |-
            import json
            import re

            async def main(args: Args) -> Output:
                params = args.params
                raw = re.sub(r'^```(?:json)?\s*|\s*```$', '', str(params.get('raw') or '').strip(), flags=re.I | re.S).strip()
                try:
                    data = json.loads(raw)
                    requested = json.loads(str(params.get('input') or '[]'))
                except Exception:
                    return {'result': '[]'}
                if isinstance(data, dict):
                    data = data.get('data', [])
                if not isinstance(data, list) or not isinstance(requested, list):
                    return {'result': '[]'}
                allowed = {str(name).strip() for name in requested if str(name).strip()}
                tag_types = {'餐次','口味','营养','烹饪方式','适用人群','食材状态','过敏原','品牌产地','时令季节','特殊场景','存储方式'}
                result = []
                seen = set()
                for item in data:
                    if not isinstance(item, dict):
                        continue
                    food = str(item.get('food') or '').strip()
                    if food not in allowed or food in seen:
                        continue
                    tags = {}
                    raw_tags = item.get('tags') or {}
                    if isinstance(raw_tags, dict):
                        for tag_type, values in raw_tags.items():
                            if tag_type not in tag_types:
                                continue
                            if not isinstance(values, list):
                                values = re.split(r'[、,，/|]+', str(values))
                            values = list(dict.fromkeys(str(value).strip() for value in values if str(value).strip()))
                            if values:
                                tags[tag_type] = values
                    if not tags:
                        continue
                    result.append({'food':food,'cate':str(item.get('cate') or '其他').strip() or '其他','isCommon':item.get('isCommon') in (1,True,'1','true'),'tags':tags})
                    seen.add(food)
                return {'result': json.dumps(result, ensure_ascii=False, separators=(',', ':'))}
        language: 3
        node_inputs:
            - name: raw
              input:
                value:
                    path: output
                    ref_node: "136806"
            - name: input
              input:
                value:
                    path: input
                    ref_node: "100001"
        node_outputs:
            result:
                type: string
                value: null
        settingOnError:
            processType: 1
            retryTimes: 0
            switch: false
            timeoutMs: 60000
