            - name: spAntiLeak
              input:
                type: boolean
                value: false
            - name: responseFormat
              input:
                type: integer
                value: "2"
            - name: parameters
              input:
                type: object
                properties:
                    max_completion_tokens:
                        type: integer
                        value: "0"
                value: null
            - name: prompt
              input:
                type: string
                value: '{{input}}'
            - name: enableChatHistory
              input:
                type: boolean
                value: false
            - name: chatHistoryRound
              input:
                type: integer
                value: "3"
            - name: systemPrompt
              input:
                type: string
                value: |-
                    你是食品计量单位标准化专家。输入是一个 JSON 食物名称数组（最多35项）。为每个名称返回适配 eat-meal-record 的常用单位及可食部克重换算。

                    强制规则：
                    1. 顶层只能返回 JSON 数组，禁止 Markdown、解释文字或额外包装。
                    2. 每个输入名称最多返回一次；food 必须与输入字符串完全一致。无法可靠判断时仍可只返回“克”单位，不得改名。
                    3. unit 必须是数组，至少1项。weight 表示1个该单位对应的可食部克重，必须是大于0且不带单位的 JSON 数字。
                    4. type 只能是 weight、count、volume、package、service、length：克/千克为 weight，毫升/升为 volume，个/枚/根为 count，袋/盒/罐为 package，碗/盘/份为 service。
                    5. 每种食物恰好一个 is_default=1，其余为0。默认单位选用户最常用且换算相对稳定的单位。
                    6. 单位换算必须具有长期复用性，不得根据某张图片、某次用餐或某个品牌的偶然份量估算。
                    7. 对尺寸差异很大的菜肴或无法稳定估算的食物，默认返回 {"name":"克","weight":1,"is_default":1,"type":"weight"}；可以省略不可靠的“份/碗/盘”。
                    8. 不返回营养、标签、说明、置信度等项目未使用字段。

                    合法输出示例：
                    [{"food":"水煮鸡蛋","unit":[{"name":"个","weight":50,"is_default":1,"type":"count"},{"name":"克","weight":1,"is_default":0,"type":"weight"}]},{"food":"清炒时蔬","unit":[{"name":"克","weight":1,"is_default":1,"type":"weight"}]}]
            - name: stableSystemPrompt
              input:
                type: string
                value: ""
            - name: canContinue
              input:
                type: boolean
                value: false
            - name: loopPromptVersion
              input:
