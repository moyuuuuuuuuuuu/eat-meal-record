    - id: "220001"
      type: code
      title: JSON校验
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "校验单位类型、正克重和唯一默认单位"
      version: v2
      position:
        x: 740
        y: 0
      parameters:
        code: |-
            import json
            import re

            async def main(args: Args) -> Output:
                params = args.params
                raw = re.sub(r'^```(?:json)?\s*|\s*```$', '', str(params.get('raw') or '').strip(), flags=re.I | re.S).strip()
                try:
                    data = json.loads(raw)
                    requested = json.loads(str(params.get('input') or '[]'))
                except Exception:
                    return {'output': '[]'}
                if isinstance(data, dict):
                    data = data.get('data', [])
                if not isinstance(data, list) or not isinstance(requested, list):
                    return {'output': '[]'}
                allowed = {str(name).strip() for name in requested if str(name).strip()}
                unit_types = {'weight','count','volume','package','service','length'}
                result = []
                seen = set()
                for item in data:
                    if not isinstance(item, dict):
                        continue
                    food = str(item.get('food') or '').strip()
                    if food not in allowed or food in seen:
                        continue
                    units = []
                    for unit in item.get('unit', item.get('units', [])):
                        if not isinstance(unit, dict):
                            continue
                        try:
                            weight = float(unit.get('weight'))
                        except Exception:
                            continue
                        name = str(unit.get('name') or '').strip()
                        unit_type = unit.get('type')
                        if name and unit_type in unit_types and weight > 0:
                            units.append({'name':name,'weight':round(weight,2),'is_default':1 if unit.get('is_default') in (1,True,'1') else 0,'type':unit_type})
                    if not units:
                        continue
                    default_index = next((i for i, unit in enumerate(units) if unit['is_default'] == 1), 0)
                    for i, unit in enumerate(units):
                        unit['is_default'] = 1 if i == default_index else 0
                    result.append({'food':food,'unit':units})
                    seen.add(food)
                return {'output': json.dumps(result, ensure_ascii=False, separators=(',', ':'))}
        language: 3
        node_inputs:
            - name: raw
              input:
                value:
                    path: output
                    ref_node: "173437"
            - name: input
              input:
                value:
                    path: input
                    ref_node: "100001"
        node_outputs:
            output:
                type: string
                value: null
        settingOnError:
            processType: 1
            retryTimes: 0
            switch: false
            timeoutMs: 60000
